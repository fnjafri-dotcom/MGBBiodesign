<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Innovation Quest: From Classroom to Boardroom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#0d0b1a; --panel:#1b1830; --ink:#f4f0ff; --muted:#b7b0d6; --line:#f4f0ff; --gold:#ffd84a; --red:#ff5a5a; --green:#5cdb7f; --blue:#5aa8ff; --amber:#ffb340; --px:"Press Start 2P", ui-monospace, monospace; --tx:"VT323", ui-monospace, monospace; }
  *{box-sizing:border-box}
  html{background:var(--bg)}
  body{margin:0;color:var(--ink);font-family:var(--tx);font-size:23px;line-height:1.25;min-height:100vh;
    background:radial-gradient(ellipse at center,#221d44 0%,#0d0b1a 70%);}
  body::after{content:"";pointer-events:none;position:fixed;inset:0;z-index:50;
    background:repeating-linear-gradient(to bottom,rgba(0,0,0,.18) 0,rgba(0,0,0,.18) 1px,transparent 2px,transparent 4px);}
  .wrap{max-width:780px;margin:0 auto;padding:16px 16px 60px}
  header.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
  .brand{font-family:var(--px);font-size:.62rem;color:var(--gold);letter-spacing:1px;text-shadow:2px 2px 0 #7a2e10}
  .who{font-family:var(--px);font-size:.5rem;color:var(--muted);display:flex;gap:10px;align-items:center}
  .who .av{font-size:1.2rem}
  .hud{display:flex;gap:10px}
  .hud span{color:var(--ink)}
  .sound{all:unset;cursor:pointer;font-family:var(--px);font-size:.5rem;color:var(--muted);border:2px solid var(--muted);padding:5px 7px}
  .progress{display:flex;gap:6px;margin:4px 0 16px}
  .progress div{flex:1;padding:8px 6px;font-family:var(--px);font-size:.48rem;text-align:center;background:#2a2547;color:#6e6894;border:3px solid #000}
  .progress div.on{color:#000}
  .progress div.done{color:#000;opacity:.55}
  .card{background:var(--panel);border:4px solid var(--line);padding:22px 20px;position:relative;
    box-shadow:0 0 0 4px #000, 8px 8px 0 4px #000;animation:pop .18s steps(3) both}
  @keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
  .tag{display:inline-block;font-family:var(--px);font-size:.5rem;padding:6px 8px;color:#000;margin-bottom:10px}
  h1{font-family:var(--px);font-size:1.25rem;line-height:1.5;margin:.2em 0 .4em;color:var(--gold);text-shadow:3px 3px 0 #7a2e10}
  h2{font-family:var(--px);font-size:.8rem;line-height:1.6;margin:.3em 0 .6em}
  h3{font-family:var(--px);font-size:.7rem;margin:.4em 0}
  p.text{white-space:pre-line;margin:0 0 16px}
  .choices{display:flex;flex-direction:column;gap:10px}
  button.choice{all:unset;cursor:pointer;display:block;background:#000;color:var(--ink);border:3px solid var(--ink);padding:12px 14px 12px 36px;position:relative;font-family:var(--tx);font-size:23px;line-height:1.2}
  button.choice::before{content:"▶";position:absolute;left:12px;top:12px;color:var(--gold);opacity:0}
  button.choice:hover,button.choice:focus-visible{background:#2a2547;border-color:var(--gold)}
  button.choice:hover::before,button.choice:focus-visible::before{opacity:1;animation:blink .6s steps(2) infinite}
  @keyframes blink{50%{opacity:0}}
  .banner{font-family:var(--px);font-size:.95rem;padding:10px 12px;margin:4px 0 12px;color:#000;display:inline-block}
  .banner.blink{animation:blink 1s steps(2) 3}
  .you{color:var(--muted);margin:0 0 6px}
  .lesson{border:3px dashed var(--gold);padding:10px 12px;margin:0 0 14px}
  .lesson b{display:block;font-family:var(--px);font-size:.5rem;color:var(--gold);margin-bottom:6px}
  .fx{font-family:var(--px);font-size:.5rem;color:var(--muted);margin:-4px 0 14px}
  .refs{margin-top:16px;font-size:20px}
  .refs summary{cursor:pointer;font-family:var(--px);font-size:.5rem;color:var(--gold)}
  .refs ul{padding-left:18px;margin:8px 0 0}
  .refs li{margin:6px 0}
  .refs a{color:var(--blue)}
  .small{color:var(--muted);font-size:19px}
  .meters{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px 0 16px}
  .meters div{background:#000;border:3px solid var(--muted);padding:6px 12px;text-align:center}
  .meters b{font-family:var(--px);font-size:.6rem}
  .meters small{display:block;color:var(--muted);font-size:18px;margin-top:4px}
  .meters .buy{color:var(--green);letter-spacing:2px}
  .stats{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:10px 0}
  .stat{background:#000;border:3px solid var(--muted);padding:6px 12px;font-family:var(--px);font-size:.7rem;text-align:center}
  .stat small{display:block;font-family:var(--tx);font-size:18px;color:var(--muted);margin-top:4px}
  .pause{text-align:center}
  .prompts{text-align:left;margin:14px 0 16px;padding-left:24px}
  .prompts li{margin:8px 0}
  .prize{display:flex;gap:14px;align-items:center;border:3px solid var(--gold);background:#000;padding:12px 14px;margin:12px 0 16px}
  .trophy{font-size:2.4rem}
  .code{font-family:var(--px);font-size:.9rem;color:#000;background:var(--gold);padding:8px 10px;display:inline-block;margin-top:8px;letter-spacing:2px;user-select:all}
  .chars{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:10px}
  @media(max-width:600px){.chars{grid-template-columns:1fr} body{font-size:21px}}
  .char{all:unset;cursor:pointer;border:4px solid;padding:14px;background:#000}
  .char:hover{background:#2a2547}
  .char .big{font-size:2.6rem}
  .char .role{color:var(--muted);margin-bottom:6px}
  .char p{margin:0;font-size:20px}
  .stages{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:14px 0}
  .stages span{padding:7px 9px;color:#000;font-family:var(--px);font-size:.45rem}
  .trail{margin-top:18px;color:var(--muted);font-size:20px}
  .trail summary{cursor:pointer;font-family:var(--px);font-size:.5rem}
  .ghost{all:unset;cursor:pointer;font-family:var(--px);font-size:.5rem;color:var(--muted);text-decoration:underline}
  footer{margin-top:24px;text-align:center;font-size:18px;color:#6e6894}
  /* boot screen */
  .walkzone{position:relative;padding-left:46px}
  .walker{position:absolute;left:2px;top:0;width:32px;height:48px;transition:top .4s steps(8);z-index:2;filter:drop-shadow(2px 2px 0 #000)}
  .walker.walking .legL{animation:stepL .1s steps(1) infinite}
  .walker.walking .legR{animation:stepR .1s steps(1) infinite}
  .walker:not(.walking){animation:idle 1.2s steps(2) infinite}
  @keyframes stepL{50%{transform:translateY(-3px)}}
  @keyframes stepR{0%{transform:translateY(-3px)}50%{transform:none}}
  @keyframes idle{50%{transform:translateY(-2px)}}
  .walkzone button.choice::before{display:none}
  .walkzone button.choice{padding-left:14px}
  .login input{all:unset;display:block;width:100%;box-sizing:border-box;background:#000;border:3px solid var(--ink);padding:10px 12px;font-family:var(--px);font-size:.7rem;color:var(--gold);margin:6px 0 14px}
  .login label{font-family:var(--px);font-size:.55rem;color:var(--muted)}
  .login .err{color:var(--red);font-family:var(--px);font-size:.55rem;min-height:1.2em;margin-top:10px}
  button.choice.picked{border-color:var(--gold);background:#2a2547}
  .cost{font-family:var(--px);font-size:.55rem;color:var(--gold);margin:-4px 0 12px;line-height:1.8}
  .rules{padding-left:22px;margin:6px 0 14px}
  .rules li{margin:6px 0}
  .b-list{list-style:none;padding:0;margin:12px 0}
  .b-row{border:3px solid #3a3560;padding:12px 14px;margin:0 0 10px;background:#120f24}
  .b-row > b{font-family:var(--px);font-size:.55rem;line-height:1.8;display:block;margin-bottom:6px}
  .bite{border:3px solid var(--red);padding:8px 12px;margin:8px 0;color:#ffd6d6}
  .boss{border-color:var(--red)}
  .clock{color:var(--gold)}
  .clock.low{color:var(--red);animation:blink .5s steps(2) infinite}
  .ring{border-color:var(--red);background:radial-gradient(ellipse at 50% 30%,#2b2050 0%,#1b1830 70%)}
  .vs-row{display:flex;align-items:center;justify-content:space-around;gap:12px;margin:10px 0 14px;flex-wrap:wrap}
  .fighter{text-align:center}
  .fname{font-family:var(--px);font-size:.6rem;margin-top:8px;line-height:1.6}
  .vs{font-family:var(--px);font-size:2.2rem;color:var(--gold);text-shadow:4px 4px 0 #7a2e10;animation:blink 1s steps(2) infinite}
  .bossart svg{max-width:150px;height:auto;filter:drop-shadow(4px 4px 0 #000)}
  .bossart.hit svg{animation:shake .4s steps(4)}
  .bossart.ko svg{transform:rotate(90deg);opacity:.7}
  .stats-card{width:100%;border-collapse:collapse;margin:6px 0 14px;background:#000}
  .stats-card th{font-family:var(--px);font-size:.5rem;color:var(--gold);text-align:left;padding:8px 10px;border:2px solid #3a3560;width:34%}
  .stats-card td{padding:6px 10px;border:2px solid #3a3560}
  .round{font-family:var(--px);font-size:1rem;text-align:center;color:var(--gold);margin:4px 0 10px}
  .bout{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:12px}
  .corner-l,.corner-r{text-align:center}
  .hp{color:var(--red);font-size:1.6rem;letter-spacing:4px}
  .pow{font-family:var(--px);font-size:1.6rem;color:var(--gold);text-align:center;text-shadow:3px 3px 0 #7a2e10;animation:pop .3s steps(3)}
  .counter{border:3px solid var(--red);padding:10px 12px;margin:0 0 12px;background:#2a0f14}
  .kotext{font-size:2.6rem!important;color:var(--red)!important;text-align:center}
  .countdown{font-family:var(--px);font-size:.6rem;color:var(--muted);line-height:1.8}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .chip{font-family:var(--px);font-size:.45rem;background:#2a2547;color:var(--gold);padding:4px 6px;border:2px solid #3a3560;line-height:1.6}
  .preview{border:4px solid var(--gold);background:#0f0c20;padding:14px;margin:14px 0 4px;text-align:center}
  .stage{display:flex;justify-content:center;align-items:flex-end;gap:10px;height:90px}
  .actor svg{animation:work .5s steps(2) infinite}
  .act-icon{font-size:2.4rem;animation:bounce .6s steps(3) infinite}
  @keyframes work{50%{transform:translateY(-4px) rotate(-3deg)}}
  @keyframes bounce{50%{transform:translateY(-10px)}}
  .act-verb{font-family:var(--px);font-size:.6rem;color:var(--gold);margin:10px 0}
  .dots{animation:blink .8s steps(2) infinite}
  .deltas{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:6px 0 10px}
  .deltas span{background:#000;border:2px solid #3a3560;padding:4px 8px}
  .confirm{background:var(--gold)!important;color:#000!important;font-family:var(--px)!important;font-size:.7rem!important;text-align:center;padding-left:14px!important}
  .boost{border:3px solid var(--green);padding:8px 12px;margin:8px 0;color:#d6ffe0}
  .scorebar{position:sticky;top:0;z-index:40;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;background:var(--bg);padding:8px 0;margin-bottom:6px}
  .scorebar:empty{display:none}
  .sb-por .por-wrap{display:block;height:54px;margin-bottom:2px}
  .sb-por .por-wrap svg{width:34px;height:48px}
  .por.m1{transform:translateY(2px)}
  .por.m2{transform:translateY(3px) rotate(-4deg)}
  .por.m3{transform:translateY(5px) rotate(-8deg)}
  .por .yawn{animation:yawn 2.4s steps(1) infinite}
  @keyframes yawn{0%{height:1px;y:15px}40%{height:4px;y:13px}80%{height:1px;y:15px}}
  .por .zz{animation:blink 1.4s steps(2) infinite}
  .piggy{display:block;margin:0 auto 2px;height:30px}
  .livepanel:empty{display:none}
  .livepanel{position:fixed;right:12px;top:12px;width:270px;max-height:calc(100vh - 24px);overflow:auto;z-index:45;background:#000;border:3px solid var(--gold);box-shadow:4px 4px 0 #000;padding:10px;font-size:18px}
  .lp-title{font-family:var(--px);font-size:.55rem;color:var(--gold);margin-bottom:8px}
  .lp-strip{font-family:var(--px);font-size:.45rem;color:var(--muted);line-height:1.6;margin-bottom:6px}
  .board.live td,.board.live th{padding:4px 6px}
  .board.live tr.me td{background:#2a2547;color:var(--gold)}
  .board.live .up{color:var(--green)}.board.live .down{color:var(--red)}
  .board.live tr.gap td{text-align:center;color:var(--muted)}
  .standings{border:3px solid var(--gold);background:#000;padding:10px 12px;margin:12px 0}
  html.has-board{--zoom:1}
  @media(min-width:1300px){html.has-board{--zoom:1.15}}
  @media(min-width:1500px){html.has-board{--zoom:1.25}}
  @media(min-width:1100px){html.has-board .wrap{margin-left:max(16px,calc((100vw - 300px - 780px * var(--zoom,1)) / 2))}}
  @media(max-width:1099px){.livepanel{position:sticky;top:auto;right:auto;width:auto;max-height:none;margin:0 16px 8px;padding:6px 10px}.livepanel .lp-table{display:none}.livepanel .lp-title{display:none}.lp-strip{margin:0}}
  .tally{display:grid;gap:4px;margin:6px 0 8px;font-size:20px}
  .tally b{font-family:var(--px);font-size:.7rem;color:var(--gold)}
  .tally .t-total b{font-size:1rem}
  .tally .pop{display:inline-block;animation:pop .3s steps(3)}
  .sb{background:#000;border:3px solid var(--ink);padding:6px 6px 8px;text-align:center;box-shadow:3px 3px 0 #000}
  .sb-l{display:block;font-family:var(--px);font-size:.42rem;color:var(--muted);margin-bottom:6px;line-height:1.4}
  .sb-v{display:block;font-family:var(--px);font-size:1.05rem;color:var(--gold);line-height:1.2}
  .sb-v small{font-size:.5rem;color:var(--muted)}
  .sb.neg{border-color:var(--red)}.sb.neg .sb-v{color:var(--red)}
  .sb.low{border-color:var(--red)}.sb.low .sb-v{color:var(--red);animation:blink .6s steps(2) infinite}
  @media(max-width:600px){.scorebar{grid-template-columns:repeat(3,minmax(0,1fr))}.sb-v{font-size:.8rem}}
  .objective{border:3px solid var(--blue);background:#0f1a33;padding:12px 14px;margin:10px 0 14px}
  .objective b{display:block;font-family:var(--px);font-size:.55rem;color:var(--blue);margin-bottom:8px}
  .world-title{font-family:var(--px);font-size:1.6rem;text-align:center;margin-top:6px}
  .cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:12px 0}
  @media(max-width:600px){.cols{grid-template-columns:1fr}}
  .col{padding:12px;border:3px solid}
  .col h3{font-size:.55rem;line-height:1.7;margin:0 0 8px}
  .col ul{list-style:none;padding:0;margin:0}
  .col li{margin:0 0 12px}
  .col li b{display:block;font-family:var(--px);font-size:.48rem;line-height:1.7;margin-bottom:4px}
  .col.good{border-color:var(--green);background:#0d2418}.col.good h3,.col.good li b{color:var(--green)}
  .col.bad{border-color:var(--red);background:#2a0f14}.col.bad h3,.col.bad li b{color:var(--red)}
  .why{color:#ffd6d6;font-size:20px;margin-top:4px}
  .continue-box{border:4px solid var(--ink);background:#000;padding:14px;margin-top:14px}
  .cont-title{font-family:var(--px);font-size:1.2rem;color:var(--gold);margin-bottom:12px;animation:blink 1s steps(2) infinite}
  .pad{display:flex;justify-content:center;gap:28px;margin:12px 0 4px}
  .pad-btn{display:flex;flex-direction:column;align-items:center;gap:8px}
  .pad-btn span{font-family:var(--px);font-size:.55rem;color:var(--red);letter-spacing:1px}
  .ctrl{all:unset;cursor:pointer;width:64px;height:22px;border-radius:12px;background:#2b2b35;border:3px solid #111;box-shadow:inset 0 -4px 0 #1a1a22,0 3px 0 #000;transform:rotate(-20deg)}
  .ctrl:hover,.ctrl:focus-visible{background:#3d3d4a;outline:3px solid var(--gold)}
  .ctrl:active{box-shadow:inset 0 2px 0 #1a1a22;transform:rotate(-20deg) translateY(2px)}
  .stamp{display:block;width:max-content;margin:6px auto 12px;font-family:var(--px);font-size:1.5rem;padding:10px 18px;border:6px double;transform:rotate(-8deg);animation:slam .35s steps(4) both;letter-spacing:2px}
  .stamp.ok{color:var(--green);border-color:var(--green)}
  .stamp.no{color:var(--red);border-color:var(--red)}
  .stamp.big{font-size:2.4rem;margin:14px auto 18px}
  @keyframes slam{0%{transform:rotate(-8deg) scale(2.4);opacity:0}70%{transform:rotate(-8deg) scale(.92);opacity:1}100%{transform:rotate(-8deg) scale(1)}}
  .soundnudge{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:3px dashed var(--gold);padding:10px 12px;margin:12px 0}
  .soundnudge .choice{padding:8px 12px;font-family:var(--px);font-size:.55rem}
  .montage{position:fixed;inset:0;z-index:80;background:radial-gradient(ellipse at center,#3a1d6a 0%,#0d0b1a 75%);display:flex;align-items:center;justify-content:center;padding:20px}
  .m-inner{text-align:center;max-width:640px;width:100%}
  .m-stage{display:flex;justify-content:center;align-items:flex-end;gap:18px;height:170px}
  .m-actor svg{animation:work .3s steps(2) infinite}
  .m-icon{font-size:4rem;animation:bounce .4s steps(3) infinite}
  .m-big{font-family:var(--px);font-size:1.3rem;line-height:1.5;color:var(--ink);margin:18px 0 8px;min-height:2.2em}
  .m-big.pop{animation:pop .25s steps(3)}
  .m-sub{font-family:var(--px);font-size:.8rem;margin-bottom:18px}
  #m-close{display:inline-block;width:auto;margin:0 auto}
  .m-bar{height:14px;border:3px solid var(--ink);margin:0 auto 18px;max-width:420px}
  .m-bar div{height:100%;width:0;background:var(--gold);transition:width .3s steps(4)}
  .savebox{border:3px solid var(--blue);background:#0f1a33;padding:12px 14px;margin:14px 0;text-align:left}
  .savebox b{display:block;font-family:var(--px);font-size:.55rem;color:var(--blue);margin-bottom:6px}
  .savecode,#pwin{display:block;width:100%;box-sizing:border-box;background:#000;color:var(--gold);border:3px solid var(--ink);font-family:ui-monospace,Menlo,monospace;font-size:13px;padding:8px;margin:8px 0;resize:vertical;word-break:break-all}
  .savebtn{all:unset;cursor:pointer;font-family:var(--px);font-size:.5rem;color:var(--ink);border:2px solid var(--muted);padding:5px 7px;margin-left:8px}
  .savebtn:hover,.savebtn:focus-visible{border-color:var(--gold);color:var(--gold)}
  .resume{display:flex;flex-direction:column;gap:10px;max-width:440px;margin:18px auto 0;text-align:left}
  .steps-dots{display:flex;gap:8px;justify-content:center;margin:0 0 14px}
  .steps-dots span{width:14px;height:14px;background:#2a2547;border:2px solid #3a3560}
  .steps-dots span.on{background:var(--gold);border-color:var(--gold)}
  .steps-dots span.done{background:var(--muted)}
  .audio-btns{display:flex;gap:6px;flex-wrap:wrap}
  .wrap{zoom:var(--zoom,1)}
  @media(min-width:1000px){:root{--zoom:1.25}}
  @media(min-width:1400px){:root{--zoom:1.45}}
  .ckbox{border:3px solid var(--gold);background:#1a1500;padding:12px 14px;margin:14px 0;text-align:left}
  .ckbox b{display:block;font-family:var(--px);font-size:.55rem;color:var(--gold);margin-bottom:6px}
  .ckcode{font-family:var(--px);font-size:.7rem;line-height:1.8;color:#000;background:var(--gold);padding:8px 10px;margin:8px 0;user-select:all;word-break:break-word}
  .nameform{display:flex;flex-direction:column;gap:10px;max-width:420px;margin:10px auto;text-align:left}
  .nameform input,#boardin{all:unset;display:block;box-sizing:border-box;width:100%;background:#000;border:3px solid var(--ink);padding:10px 12px;font-family:var(--px);font-size:.75rem;color:var(--gold)}
  #boardin{font-family:ui-monospace,Menlo,monospace;font-size:14px;white-space:pre-wrap}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .board{width:100%;border-collapse:collapse;margin:10px 0;background:#000}
  .board th{font-family:var(--px);font-size:.5rem;color:var(--gold);text-align:left;padding:8px;border:2px solid #3a3560}
  .board td{padding:6px 8px;border:2px solid #3a3560}
  .board tr.lead td{color:var(--gold);font-weight:bold}
  .words{border:3px dotted var(--blue);background:#0b1430;padding:8px 12px;margin:0 0 14px;font-size:20px}
  .words summary{cursor:pointer;font-family:var(--px);font-size:.5rem;color:var(--blue)}
  .words dl{margin:8px 0 0}
  .words dt{font-weight:bold;color:var(--gold)}
  .words dd{margin:0 0 8px 0;color:var(--ink)}
  .profile{margin:16px 0}
  .col.grow{border-color:var(--amber);background:#2a1d08}.col.grow h3,.col.grow li b{color:var(--amber)}
  .pbar{display:block;height:10px;border:2px solid #3a3560;background:#000;margin:4px 0 6px}
  .pbar span{display:block;height:100%;background:var(--gold)}
  .course-cta{border:4px solid var(--green);background:#0d2418;padding:14px 16px;margin:16px 0;font-size:22px}
  .course-cta b:first-child{display:block;font-family:var(--px);font-size:.6rem;color:var(--green);margin-bottom:8px}
  .boot{text-align:center}
  .cart{width:260px;max-width:70vw;height:auto;display:block;margin:6px auto 14px;filter:drop-shadow(6px 6px 0 #000);transition:transform .2s}
  .cart.puff{animation:shake .4s steps(4)}
  @keyframes shake{25%{transform:translate(-4px,2px) rotate(-2deg)}50%{transform:translate(4px,-2px) rotate(2deg)}75%{transform:translate(-2px,0)}}
  .bigbtn{all:unset;cursor:pointer;font-family:var(--px);font-size:.75rem;color:#000;background:var(--gold);padding:14px 16px;border:4px solid #000;box-shadow:4px 4px 0 #000}
  .bigbtn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 #000}
  .start{font-family:var(--px);font-size:.9rem;color:var(--ink);animation:blink 1s steps(2) infinite;margin:14px 0}
  .glitch{font-family:var(--px);font-size:.7rem;line-height:1.8;color:var(--ink);background:#000;padding:16px;margin:10px 0;word-break:break-all;text-align:left}
  .glitch span{display:inline-block;width:14px;height:14px;margin:1px}
  .puffs{font-size:2rem;height:2rem}
  .copyright{font-family:var(--px);font-size:.45rem;color:#6e6894;margin-top:18px;line-height:1.8}
  .toast{position:fixed;left:50%;top:20px;transform:translateX(-50%);background:var(--gold);color:#000;font-family:var(--px);font-size:.6rem;padding:12px 14px;border:4px solid #000;z-index:60;box-shadow:4px 4px 0 #000}
.evflash{animation:evflash .5s steps(2) 4}
@keyframes evflash{50%{filter:invert(1)}}
.card.event{border-color:var(--red)}
</style>

  const cur = () => parseFloat(getComputedStyle(root).getPropertyValue("--zoom")) || 1;
  let z = null; try { z = parseFloat(localStorage.getItem("iq_zoom")); } catch (e) {}
  if (z) root.style.setProperty("--zoom", z);
  document.getElementById("tsize").addEventListener("click", () => {
    const c = cur(), nxt = steps.find(v => v > c + 0.01) || steps[0];
    root.style.setProperty("--zoom", nxt); try { localStorage.setItem("iq_zoom", nxt); } catch (e) {}
  });
})();

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(u, p) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(u.trim().toUpperCase() + ":" + p.trim().toLowerCase()), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(BLOB.s), iterations: BLOB.n, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(BLOB.i) }, key, b64(BLOB.c));
  const sc = document.createElement("script"); sc.textContent = new TextDecoder().decode(pt); document.body.appendChild(sc);
  try { sessionStorage.setItem("iq_login", JSON.stringify([u, p])); } catch (e) {}
}
function loginScreen(msg) {
  document.getElementById("app").innerHTML = `<div class="card boot login"><h1>ENTER PASSWORD</h1>
    <p class="text">Welcome, HPEd Meet-up players! Enter the login from your host.</p>
    <form id="lf" style="text-align:left;max-width:420px;margin:0 auto">
      <label for="lu">USERNAME</label><input id="lu" autocomplete="username" autocapitalize="characters" spellcheck="false">
      <label for="lp">PASSWORD</label><input id="lp" type="password" autocomplete="current-password">
      <div style="text-align:center"><button class="bigbtn" type="submit">▶ LOAD GAME</button></div>
      <div class="err" id="le">${msg || ""}</div>
    </form></div>`;
  document.getElementById("lf").addEventListener("submit", async ev => {
    ev.preventDefault(); const le = document.getElementById("le"); le.textContent = "LOADING...";
    try { await unlock(document.getElementById("lu").value, document.getElementById("lp").value); }
    catch (e) { le.textContent = "WRONG PASSWORD. BLOW ON IT AND TRY AGAIN."; }
  });
  document.getElementById("lu").focus();
}
(async () => {
  let saved = null; try { saved = JSON.parse(sessionStorage.getItem("iq_login")); } catch (e) {}
  if (saved) { try { await unlock(saved[0], saved[1]); return; } catch (e) {} }
  loginScreen();
})();
</script>
